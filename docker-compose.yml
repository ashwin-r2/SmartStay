services:
  postgres:
    image: postgres:16-alpine
    container_name: staysmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-staysmart}
      POSTGRES_USER: ${DB_USERNAME:-staysmart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staysmart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-staysmart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: staysmart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-staysmart}
      DB_USERNAME: ${DB_USERNAME:-staysmart}
      DB_PASSWORD: ${DB_PASSWORD:-staysmart}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-prod-min-32-bytes-please}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: staysmart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
