spring:
  datasource:
    url: jdbc:h2:mem:staysmart_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-junit-tests-min-32-bytes-long
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 1209600000
  ai:
    openai:
      api-key: ""
