spring:
  application:
    name: staysmart-ai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staysmart}
    username: ${DB_USERNAME:staysmart}
    password: ${DB_PASSWORD:staysmart}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-prod-min-32-bytes-please}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}      # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    base-url: ${UPLOADS_BASE_URL:/api/files}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      temperature: ${OPENAI_TEMPERATURE:0.7}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  booking:
    free-cancellation-hours: 48

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.staysmart: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
